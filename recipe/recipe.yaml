# yaml-language-server: $schema=https://raw.githubusercontent.com/prefix-dev/recipe-format/main/schema.json
schema_version: 1

context:
  version: "0.9.6"
  python_check_max: "3.14"
  # upstream claims `4.2`, but this fails `jupyter labextension list`
  jupyterlab_min: "4.5"
  jupyterlab_max: "5.0"

package:
  name: nbgrader
  version: ${{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/n/nbgrader/nbgrader-${{ version }}.tar.gz
  sha256: d01c3a1033c0ef1535936fc53b8e152b46e1e06c02422dca5ef7d5ae62076d4f

build:
  number: 0
  noarch: python
  script:
    - ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation --disable-pip-version-check --check-build-dependencies
  python:
    entry_points:
      - nbgrader = nbgrader.apps.nbgraderapp:main

requirements:
  host:
    - hatch-jupyter-builder >=0.7
    - hatchling >=1.10.0
    - jupyter-builder >=1.2.3
    - pip
    - python ${{ python_min }}.*
  run:
    - alembic >=1.7
    - ipython >=8.10.0
    - ipywidgets >=7.6
    - jinja2 >=3
    - jsonschema >=3
    - jupyter_client <9
    - jupyter_server >=2
    - jupyterlab >=${{ jupyterlab_min }},<${{ jupyterlab_max }}
    - jupyterlab_server
    - nbclient >=0.6.1
    - nbconvert >=6
    - notebook >=7.2.0,<8
    - python >=${{ python_min }}
    - python-dateutil >=2.8
    - pyyaml >=6.0
    - rapidfuzz >=1.8
    - requests >=2.26
    - setuptools
    - sqlalchemy >=1.4,<3

tests:
  - package_contents:
      strict: true
      files:
        - etc/jupyter/jupyter_server_config.d/nbgrader.json
        - share/jupyter/labextensions/@jupyter/nbgrader/**
      site_packages:
        - nbgrader/**
        - nbgrader-${{ version }}.dist-info/**
  - python:
      imports: nbgrader
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - ${{ python_check_max }}.*
  - requirements:
      run:
        - jupyterlab ${{ jupyterlab_min }}.*
        - if: win
          then: m2-grep
        - pip
        - python ${{ python_min }}.*
    script:
      - nbgrader -h
      - jupyter lab --version
      - jupyter labextension list
      - jupyter server extension list
      - jupyter labextension list 1>labextensions 2>&1
      - jupyter server extension list 1>server_extensions 2>&1
      - grep -iE "nbgrader.server_extensions.${{ ext }}.*OK" server_extensions
      - grep -iE "nbgrader.server_extensions.${{ ext }}.*enabled" server_extensions
      - grep -iE "@jupyter/nbgrader.*OK" labextensions

about:
  license: BSD-3-Clause
  license_file:
    - LICENSE
    - nbgrader/labextension/static/third-party-licenses.json
  summary: A system for assigning and grading Jupyter notebooks
  homepage: https://pypi.org/project/nbgrader
  repository: https://github.com/jupyter/nbgrader
  documentation: https://nbgrader.readthedocs.io

extra:
  recipe-maintainers:
    - blink1073
    - jhamrick
    - lgpage
    - ocefpaf
    - BertR
    - SylvainCorlay
    - bollwyvl
